# iOS Automation configuration

device:
  udid: "REPLACE_WITH_DEVICE_UDID"
  team_id: "REPLACE_WITH_APPLE_TEAM_ID"
  appium_server_url: "http://127.0.0.1:4723"
  xcode_signing_id: "Apple Development"
  keep_wda: true


runner:
  sequential: true
  uninstall_after_each_test: true
  stop_on_first_failure: false
  app_install_timeout_ms: 480000
  launch_wait_seconds: 5
  work_dir: "work/ios"
  permission_alerts:
    enabled: true
    # dismiss = tap Don't Allow / Ask App Not to Track where possible.
    # alert_only = record the alert and leave it for the tester.
    # accept = tap Allow/OK where possible.
    action: "dismiss"
    wait_seconds: 2
    max_alerts: 3

apps:
  - id: "app_one"
    name: "App One"
    bundle_id: "com.example.appone"
    test_bundle_id: "com.example.appone.test"
    artifact:
      source: "local_ipa"
      ipa: "intake/ios/ipas/AppOne.ipa"
      workspace_dir: "work/ios/acquired"
      expected_bundle_id: "com.example.appone"
    expected_behavior:
      app_state_must_be_foreground: true
      source_contains:
        - "Login"
      source_not_contains:
        - "Tamper detected"
        - "Integrity check failed"
      app_specific_check: null
    risks:
      ios-feature1-risk1:
        enabled: true
        analyzer:
          provider: "mobsf"
          mobsf_url: "http://127.0.0.1:8000"
          api_key_env: "MOBSF_API_KEY"
          timeout_seconds: 120
          auto_start:
            enabled: false
            command: []
            wait_seconds: 90
            stop_after_scan: false
            generate_api_key: true
          fallback_to_builtin: true
        sensitive_scan:
          reveal_values: false

      ios-feature5-risk1:
        enabled: false
        keyboard_app:
          bundle_id: "com.example.LocalKeyboard"
          keyboard_extension_bundle_id: "com.example.LocalKeyboard.KeyboardExtension"
          ipa: "intake/ios/ipas/LocalKeyboard.ipa"
          install: true
          launch: true
          uninstall_after_test: false
          server_setup:
            server_url_input_accessibility_id: "server-url-input"
            clear_first: true
            save_button_accessibility_id: null
        collection:
          bind_host: "0.0.0.0"
          advertised_host: "REPLACE_WITH_MAC_LAN_IP"
          port: 8765
          pair_timeout_seconds: 120
          keyboard_setup_wait_seconds: 0
          evidence_source: "local_app_ui"
          evidence_timeout_seconds: 30
          probe_text: "hello"
          expected_collected_text: "hello"
          local_log:
            wait_after_launch_seconds: 1
            expected_items: ["h", "e", "l", "l", "o"]
          input:
            method: "keyboard_buttons"
            key_accessibility_ids:
              h: "H"
              e: "E"
              l: "L"
              o: "O"
          text_field:
            accessibility_id: null
          auto_navigation:
            enabled: true
            max_steps: 4
            settle_seconds: 1
            allow_any_button: false
            button_label_contains:
              - "Log in"
              - "Login"
              - "Use password"
              - "Search"
              - "Select Car Park"
          keyboard_selection:
            enabled: true
            attempts: 6
            settle_seconds: 0.5
            expected_source_contains:
              - "LocalKeyboard"
              - "com.example.LocalKeyboard.KeyboardExtension"
            switch_button_accessibility_ids:
              - "Next keyboard"
              - "Next Keyboard"
              - "Globe"
            switch_button_label_contains:
              - "next keyboard"
              - "globe"
              - "keyboard"

  - id: "app_two"
    name: "App Two"
    bundle_id: "com.example.apptwo"
    test_bundle_id: "com.example.apptwo.test"
    artifact:
      source: "local_ipa"
      ipa: "intake/ios/ipas/AppTwo.ipa"
      expected_bundle_id: "com.example.apptwo"
    expected_behavior:
      app_state_must_be_foreground: true
      source_contains: []
      source_not_contains:
        - "Tamper detected"
        - "Integrity check failed"
      app_specific_check: null
    risks:
      ios-feature1-risk1:
        enabled: true
        analyzer:
          provider: "mobsf"
          mobsf_url: "http://127.0.0.1:8000"
          api_key_env: "MOBSF_API_KEY"
          timeout_seconds: 120
          auto_start:
            enabled: false
            command: []
            wait_seconds: 90
            stop_after_scan: false
            generate_api_key: true
          fallback_to_builtin: true

  - id: "installed_app_example"
    name: "Installed App Example"
    bundle_id: "com.vendor.installedapp"
    artifact:
      source: "installed_app_reference"
      require_original_app_installed: true
    expected_behavior:
      app_state_must_be_foreground: true
      source_contains: []
      source_not_contains:
        - "Tamper detected"
        - "Integrity check failed"
      app_specific_check: null
    risks:
      ios-feature1-risk1:
        enabled: false
