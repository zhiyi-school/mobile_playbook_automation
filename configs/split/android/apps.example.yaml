# Example Android app roster. Copy to apps.yaml and add only authorized test apps; see docs/android/configuration.md.

apps:
  - id: "example_app"
    name: "Example App"
    package_name: "com.example.app"
    # Optional: whether the app needs Google Play services. Unset, the app's intake APK manifest decides; device risks
    # for an app that needs them are not run on a device without them.
    # requires_play_services: false
    risks:
      android-feature-01-risk-01:
        enabled: true
      android-feature-01-risk-02:
        enabled: true
      android-feature-02-risk-01:
        enabled: true
      android-feature-02-risk-02:
        enabled: true
        # Optional: steps that take the app through a sensitive flow while its log is captured, typing synthetic
        # canaries from runtime_logs.canaries. Without steps the app is left running for dwell_seconds instead.
        # steps:
        #   - type: {id: "com.example.app:id/email", value: "{canary.email}"}
        #   - type: {accessibility_id: "Password", value: "{canary.password}"}
        #   - tap: {text: "Sign in"}
        #   - wait: 3
      android-feature-03-risk-01:
        enabled: true
        # The app's own servers; traffic to them read through Burp is the app's.
        expected_hosts: ["api.example.com"]
        # Optional: the same kind of steps as above, so a sign-in passes through Burp with canary values.
        # steps:
        #   - type: {id: "com.example.app:id/email", value: "{canary.email}"}
        #   - type: {accessibility_id: "Password", value: "{canary.password}"}
        #   - tap: {text: "Sign in"}
        #   - wait: 3
      android-feature-06-risk-01:
        enabled: true
      android-feature-07-risk-01:
        enabled: true
    sector: "Government"
    agency: "Example Agency"
    version: "1.0.0"
    cisos:
      - name: "Jane Doe"
        email: "jane.doe@example.gov"
