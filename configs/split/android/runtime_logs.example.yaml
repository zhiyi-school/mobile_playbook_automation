# Example Android runtime_logs settings for android-feature-02-risk-02. Copy to runtime_logs.yaml; see
# docs/android/configuration.md#runtime-logs-android-feature-02-risk-02.

runtime_logs:
  # Seconds after launch before the app's screen is checked for a USB debugging warning.
  launch_wait: 5
  # Seconds the app stays open while its log is captured.
  dwell_seconds: 15
  # Report sensitive values found in the log in full instead of masked, in the findings and the exported log.
  reveal_values: false
  # Keep the unfiltered capture, which holds every app's log lines, under artifacts/work/android/runtime_logs/<package>/
  # instead of deleting it after the app's lines are taken from it. It is never copied into the report.
  keep_raw: false
  # Seconds a scripted step waits for its element to appear. Scripted steps are set per app, under the app's
  # risks.android-feature-02-risk-02.steps in apps.yaml; with them the app runs its steps instead of dwell_seconds.
  step_timeout_seconds: 10
  # Synthetic values a scripted "type" step can enter as {canary.<name>}; the log is searched for each one typed, also
  # without separators, lowercased, URL-encoded and base64-encoded. Never use real credentials or personal data. These
  # are the built-in defaults; a name set here, or under an app's own canaries, replaces that value.
  canaries:
    email: "canary.logtest@example.com"
    password: "Canary-Pw-7Q4z"
    card: "4111 1111 1111 1111"
    nric: "S0000000Z"
