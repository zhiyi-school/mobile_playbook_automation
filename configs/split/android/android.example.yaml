# Split Android config entry point. Pass this file to --config when you want
# device, runner, tools, repackaging, screen_capture, and apps stored separately.
include:
  device: device.example.yaml
  runner: runner.example.yaml
  tools: tools.example.yaml
  repackaging: repackaging.example.yaml
  screen_capture: screen_capture.example.yaml
  apps: apps.example.yaml
