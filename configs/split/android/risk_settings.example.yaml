# Example Android tool/risk settings. Split real settings into one file per top-level key; see docs/android/configuration.md.
tools:
  mobsf_url: "http://localhost:8000"
  mobsf_api_key: ""
  burp_proxy: "http://127.0.0.1:8080"

repackaging:
  work_dir: "artifacts/work/android/repackaging"
  keystore_path: null
  keystore_alias: "mobileplaybook"
  keystore_pass: "password"
  restore_original_after_test: true
  record_lead_in: 2
  launch_wait: 8
  post_click_wait: 5
  record_tail: 3

screen_capture:
  record_lead_in: 2
  launch_wait: 4
  record_tail: 5
