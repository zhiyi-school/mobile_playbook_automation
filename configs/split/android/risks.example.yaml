# Example Android risk text shown in the dashboard. Copy to risks.yaml; see docs/android/risks.md#risk-metadata.
android-feature-01-risk-01:
  name: Android APK Static Analysis
  description: The app's APK can be obtained and unpacked, so static analysis exposes its manifest, permissions, exported components, code, bundled resources and any embedded secrets.
  tactic: Discovery
  demonstration:
    - id: setup_table
      type: table
      label: Setup
      rows:
        - Configuration: APK source
          Detail: "The app's installable APK in artifacts/intake/android/apks/, found by its package name; no device is needed"
        - Configuration: Analyzer
          Detail: MobSF when apk_static_analysis.analyzer.provider is mobsf, otherwise the built-in scanner; a failed MobSF scan falls back to the built-in scanner when fallback_to_builtin is true
    - id: steps
      type: steps
      label: Demonstration
      items:
        - id: step_1
          text: Find the app's APK in the intake folder by the package name read from each APK, and hash it
          images: []
          commands:
            - aapt dump badging <App_Name>_<version>.apk
        - id: step_2
          text: Upload the APK to MobSF, start the scan and fetch the JSON report
          images: []
          commands:
            - POST /api/v1/upload
            - POST /api/v1/scan
            - POST /api/v1/report_json
        - id: step_3
          text: "Built-in scanner (fallback): dump the manifest, inventory the APK's files, and scan text assets, DEX code and resources.arsc for secrets"
          images: []
          commands:
            - aapt dump xmltree <App_Name>_<version>.apk AndroidManifest.xml
        - id: step_4
          text: Write apk_analysis.json, package_inventory.json, critical_findings.json and critical_findings.md (and mobsf_report.json when MobSF was used)
          images: []
          commands: []


