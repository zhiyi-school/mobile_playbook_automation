android-feature-02-risk-01:
  name: Android USB Debugging Private Data Test
  description: Over USB debugging, the private data directory of a debuggable app can be read with run-as without root, so any sensitive data the app stores there in plain text can be collected; an app that allows backups may give up its data through adb backup instead.
  tactic: Credential Access
  demonstration:
    - id: setup_table
      type: table
      label: Setup
      rows:
        - Configuration: Requires
          Detail: adb over an authorized USB debugging connection (with Corellium role devices, the non-rooted device); developer mode and USB debugging are already on when adb connects
        - Configuration: Directories read
          Detail: /data/data/<package> and, when present, /data/user_de/0/<package>
    - id: steps
      type: steps
      label: Demonstration
      items:
        - id: step_1
          text: Read the installed app's package flags and target API level, and the device's API level
          images: []
          commands:
            - adb shell dumpsys package <package>
            - adb shell getprop ro.build.version.sdk
        - id: step_2
          text: Check whether run-as runs commands as the app's user, which only a debuggable app allows
          images: []
          commands:
            - adb shell run-as <package> id -u
        - id: step_3
          text: If run-as is refused, record whether adb backup would return the app's data (ALLOW_BACKUP, and from Android 12 a target API level of 30 or lower) without running a backup
          images: []
          commands: []
        - id: step_4
          text: Otherwise launch the app so it writes its data, wait launch_wait seconds, and stop it
          images: []
          commands:
            - adb shell monkey -p <package> -c android.intent.category.LAUNCHER 1
            - adb shell am force-stop <package>
        - id: step_5
          text: List the private data directories with run-as and stream them to the workstation as a tar archive, writing nothing on the device
          images: []
          commands:
            - adb shell run-as <package> sh -c 'ls -laR /data/data/<package>'
            - adb shell -T run-as <package> tar -cf - -C / data/data/<package> > archive.tar
        - id: step_6
          text: Read every file as android-feature-07-risk-01 does, flagging secrets and personal data stored in plain text, then write private_data_listing.txt, private_data_findings.json and the critical findings, and delete the archive unless keep_archive is true
          images: []
          commands: []

android-feature-02-risk-02:
  name: Android Runtime Log Capture Test
  description: Over USB debugging, the device log can be read with adb logcat, so any credentials, tokens or personal data the app writes to its runtime log while it runs can be collected.
  tactic: Collection
  demonstration:
    - id: setup_table
      type: table
      label: Setup
      rows:
        - Configuration: Requires
          Detail: adb over an authorized USB debugging connection and Appium (with Corellium role devices, the non-rooted device); developer mode and USB debugging are already on when adb connects
        - Configuration: Log read
          Detail: The device's main, system and crash log buffers through adb logcat. The playbook's tester uses Android Studio's Logcat window; this test is scripted, so it reads the same log with adb instead
    - id: steps
      type: steps
      label: Demonstration
      items:
        - id: step_1
          text: Record whether USB debugging is on in Settings.Global.ADB_ENABLED and read the app's user ID
          images: []
          commands:
            - adb shell settings get global adb_enabled
            - adb shell dumpsys package <package>
        - id: step_2
          text: Stop the app, clear the log buffers and stream the device log to the workstation, with each line's user ID where the device supports it
          images: []
          commands:
            - adb shell am force-stop <package>
            - adb logcat -c
            - adb logcat -v threadtime -v uid > logcat.txt
        - id: step_3
          text: Launch the app, wait launch_wait seconds and check its screen for a warning that USB debugging is on; without one, leave it running for dwell_seconds
          images: []
          commands: []
        - id: step_4
          text: Stop the app and the capture, and keep only the lines the app wrote, by its user ID or, where lines carry none, by its process IDs
          images: []
          commands:
            - adb shell ps -A
        - id: step_5
          text: Scan the app's lines for credentials, tokens and personal data, then write logcat_<package>.txt with the values found masked, runtime_log_findings.json and the critical findings, and delete the unfiltered capture unless keep_raw is true
          images: []
          commands: []

android-feature-04-risk-01:
  name: Android Overlay Test
  description: Another app allowed to display over other apps may draw its own window over the app's screens, because the app does not hide non-system overlay windows while it is shown.
  tactic: null
  demonstration:
    - id: setup_table
      type: table
      label: Setup
      rows:
        - Configuration: Requires
          Detail: adb, appium, overlay_attacker (F4_Overlay_Attacker.apk in the Android intake folder, or the current attacker app already installed)
        - Configuration: Coverage
          Detail: The app's risks.android-feature-04-risk-01.steps take it to the screen tested, such as its sign-in screen; without them the overlay is tested over the launch screen
    - id: steps
      type: steps
      label: Demonstration
      items:
        - id: step_1
          text: Record the installed APK's hash, connect Appium and return to the home screen
          images: []
          commands: []
        - id: step_2
          text: Install the attacker app without granting permissions, start it titled after the app, and record the Display over other apps list
          images: []
          commands:
            - adb shell am start -S -n com.mobileplaybook.overlay/.MainActivity
            - adb shell am start -a android.settings.action.MANAGE_OVERLAY_PERMISSION
        - id: step_3
          text: Turn on Allow display over other apps for the attacker in Settings, falling back to appops only when the switch cannot be found, confirm the grant, and start the attacker again
          images: []
          commands:
            - adb shell am start -a android.settings.action.MANAGE_OVERLAY_PERMISSION -d package:com.mobileplaybook.overlay
            - adb shell appops get com.mobileplaybook.overlay SYSTEM_ALERT_WINDOW
        - id: step_4
          text: Launch the app, run its scripted steps if any, confirm it is in the foreground (or resumed behind the focused overlay), and check whether the attacker's overlay window is shown over it
          images: []
          commands:
            - adb shell dumpsys window windows
            - adb shell dumpsys activity activities
        - id: step_5
          text: When the overlay is shown, confirm with synthetic test values that the attacker app records what is entered into its window
          images: []
          commands: []
        - id: step_6
          text: Decide the verdict, then stop the attacker, reset its overlay permission, close the app and write the report
          images: []
          commands:
            - adb shell am force-stop com.mobileplaybook.overlay
            - adb shell appops set com.mobileplaybook.overlay SYSTEM_ALERT_WINDOW default

android-feature-05-risk-01:
  name: Android Accessibility UI Operations Test
  description: Another app registered as an accessibility service can read the app's screens and click its controls on the user's behalf, logging the user out without any interaction when the app does not require re-authentication for the action.
  tactic: Impact
  demonstration:
    - id: setup_table
      type: table
      label: Setup
      rows:
        - Configuration: Requires
          Detail: adb, appium, accessibility_attacker (F5R1_Accessibility_Attacker.apk in the Android intake folder, or the current attacker app already installed)
        - Configuration: Coverage
          Detail: The app's risks.android-feature-05-risk-01.steps sign it in and reach a screen with a logout control; its logged_out locator names an element shown only after logout. Without them the app is tested on its launch screen and is usually inconclusive
    - id: steps
      type: steps
      label: Demonstration
      items:
        - id: step_1
          text: Record the installed APK's hash and the current accessibility settings, connect Appium with accessibility suppression disabled, and return to the home screen
          images: []
          commands: []
        - id: step_2
          text: Install the attacker app and confirm it declares the playbook's accessibility service; the provided app stands in for writing the malicious app
          images: []
          commands:
            - adb shell pm query-services -a android.accessibilityservice.AccessibilityService
        - id: step_3
          text: The provided attacker app's accessibility configuration and logout-clicking logic follow the playbook
          images: []
          commands: []
        - id: step_4
          text: Point the attacker at the app, run its scripted steps to a logged-in screen, record whether a logout control is visible, turn the service on in Settings (falling back to its details page then secure settings), confirm it is bound, open the app and read what the service clicked
          images: []
          commands:
            - adb shell am start -a android.settings.ACCESSIBILITY_SETTINGS
            - adb shell dumpsys accessibility
        - id: step_5
          text: Show the Accessibility list with the service now listed
          images: []
          commands:
            - adb shell am start -a android.settings.ACCESSIBILITY_SETTINGS
        - id: step_6
          text: Confirm the service's switch is on
          images: []
          commands: []

