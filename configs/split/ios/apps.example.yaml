apps:
  # To add another app:
  # - copy one app block
  # - change name/id and artifact.ipa
  # - leave bundle_id blank to infer it from the IPA
  #
  # Each risk's shared settings (analyzer config, keyboard/collection config) come
  # from the global ipa_static_analysis.yaml / keystroke_collection.yaml files —
  # `enabled: true` here is what turns the risk on for this app. Nest a field under
  # a risk to override just that field for this app alone, e.g.:
  #
  #   ios-feature-04-risk-01:
  #     enabled: true
  #     collection:
  #       auto_navigation:
  #         accessibility_ids:
  #           - "btn_some_button"
  - id: "app_one"
    name: "App One"
    bundle_id: "com.example.appone"
    test_bundle_id: "com.example.appone.test"
    artifact:
      source: "local_ipa"
      ipa: "intake/ios/ipas/AppOne.ipa"
      workspace_dir: "work/ios/acquired"
      expected_bundle_id: "com.example.appone"
    expected_behavior:
      app_state_must_be_foreground: true
      source_contains: ["Login"]
      source_not_contains:
        - "Tamper detected"
        - "Integrity check failed"
      app_specific_check: null
    risks:
      ios-feature1-risk1:
        enabled: true
      ios-feature-04-risk-01:
        enabled: false
