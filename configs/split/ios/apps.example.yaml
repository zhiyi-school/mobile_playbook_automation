# Example iOS app roster. Copy to apps.yaml and add only authorized test apps; see docs/ios/configuration.md.
apps:
  - id: "app_one"
    name: "App One"
    bundle_id: "com.example.appone"
    test_bundle_id: "com.example.appone.test"
    artifact:
      source: "local_ipa"
      ipa: "intake/ios/ipas/AppOne.ipa"
      workspace_dir: "work/ios/acquired"
      expected_bundle_id: "com.example.appone"
    expected_behavior:
      app_state_must_be_foreground: true
      source_contains: ["Login"]
      source_not_contains:
        - "Tamper detected"
        - "Integrity check failed"
      app_specific_check: null
    risks:
      ios-feature-01-risk-01:
        enabled: true
      ios-feature-02-risk-01:
        enabled: false
        expected_hosts:
          - "api.example.com"
      ios-feature-04-risk-01:
        enabled: false
    sector: "Government"
    agency: "Example Agency"
    version: "1.0.0"
    cisos:
      - name: "Jane Doe"
        email: "jane.doe@example.gov"
