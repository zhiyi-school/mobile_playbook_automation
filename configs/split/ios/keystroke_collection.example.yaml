# Example iOS keystroke_collection settings. Copy to keystroke_collection.yaml; see docs/ios/configuration.md.

keystroke_collection:
  keyboard_app:
    bundle_id: "com.example.LocalKeyboard"
    keyboard_extension_bundle_id: "com.example.LocalKeyboard.KeyboardExtension"
    ipa: "artifacts/companion/ios/ipas/LocalKeyboard.ipa"
    resign:
      enabled: true
      timeout_seconds: 900
    install: true
    launch: true
    uninstall_after_test: false
    server_setup:
      server_url_input_accessibility_id: "server-url-input"
      clear_first: true
      save_button_accessibility_id: null
  collection:
    bind_host: "0.0.0.0"
    advertised_host: "auto"
    port: 8765
    pair_timeout_seconds: 120
    network_alert_wait_seconds: 10
    keyboard_setup_wait_seconds: 2
    keyboard_setup:
      mode: "appium_ui"
      keyboard_display_names:
        - "Local Keyboard"
        - "LocalKeyboard"
      require_full_access: true
      navigation_timeout_seconds: 20
      probe_timeout_seconds: 2
    evidence_source: "local_app_ui"
    evidence_timeout_seconds: 30
    probe_text: "hello"
    expected_collected_text: "hello"
    local_log:
      wait_after_launch_seconds: 1
      expected_items: ["h", "e", "l", "l", "o"]
    input:
      method: "keyboard_buttons"
      key_accessibility_ids:
        h: "H"
        e: "E"
        l: "L"
        o: "O"
    text_field:
      accessibility_id: null
    auto_navigation:
      enabled: true
      max_steps: 4
      settle_seconds: 1
      allow_any_button: false
      accessibility_ids: []
      button_label_contains:
        - "Log in"
        - "Login"
        - "Use password"
        - "Log in with password"
        - "Login with password"
        - "Sign in with password"
        - "Sign in"
        - "Continue"
        - "Next"
        - "Get started"
        - "Start"
        - "Search"
        - "Select Car Park"
        - "Enter Vehicle Details"
      exclude_button_label_contains:
        - "Delete"
        - "Remove"
        - "Cancel"
        - "Log out"
        - "Sign out"
        - "Forgot"
        - "Pay"
        - "Purchase"
    keyboard_selection:
      enabled: true
      attempts: 6
      settle_seconds: 0.5
      expected_source_contains:
        - "LocalKeyboard"
        - "com.example.LocalKeyboard.KeyboardExtension"
      active_marker_contains: []
      switch_button_accessibility_ids:
        - "Next keyboard"
        - "Next Keyboard"
        - "Globe"
      switch_button_label_contains:
        - "next keyboard"
        - "globe"
        - "keyboard"
