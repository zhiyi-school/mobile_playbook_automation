# Example Android entry config. Copy to configs/android.yaml and fill local values; see docs/android/configuration.md.

device:
  appium_server_url: "http://127.0.0.1:4723"
  adb_path: "adb"
  adb_serial: null    # A serial from "adb devices", or "wifi" to follow the phone's Wi-Fi address.
  # How missing apps are installed: "apk" (adb, from the app's APK in artifacts/intake/android/apks/),
  # "play_store" (default) or "aurora_store".
  app_store: "play_store"
  appium_auto_start:
    enabled: false
    command: ["appium"]
    wait_seconds: 60
    poll_interval_seconds: 1

runner:
  auto_grant_permissions: false
  # Keep the device's screen on whenever it is charging (adb shell svc power stayon true). Changes a device setting.
  keep_screen_on: false

include:
  tools: split/android/tools.yaml
  apk_static_analysis: split/android/apk_static_analysis.yaml
  repackaging: split/android/repackaging.yaml
  screen_capture: split/android/screen_capture.yaml
  apps: split/android/apps.yaml
