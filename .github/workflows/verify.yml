name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  documentation-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_requirements.py
      - run: python scripts/check_docs.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m compileall -q mobile_playbook
      - run: python -m pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: >-
          python -m pytest -q
          tests/test_api_reports.py
          tests/test_report_evidence.py
          tests/test_api_playbook.py
          tests/test_playbook_validator.py
