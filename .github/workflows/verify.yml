# CI checks for docs, the dependency mirror, the backend test suite and API contract tests.

name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  documentation-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_requirements.py
      - run: python scripts/check_docs.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q mobile_playbook
      - run: python -m ruff check .
      - run: python -m pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          tests/api/test_reports.py
          tests/api/test_report_evidence.py
          tests/api/test_playbook.py
          tests/playbook/test_validator.py


  screen-capture-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: brew install tesseract
      - run: python -m pip install -e ".[dev]"
      - name: Require the native capture dependencies and English OCR data
        run: |
          python -c "from mobile_playbook.platforms.ios.screen_capture.ocr import ocr_unavailable_reason; error = ocr_unavailable_reason(); assert error is None, error"
          python -c "import AppKit, AVFoundation, CoreMedia, Quartz"
      - run: >-
          python -m pytest -q
          --require-native-capture
          tests/platforms/ios/screen_capture
          tests/platforms/ios/risks/test_feature_03_risk_01_screen_capture.py
          tests/platforms/ios/test_config.py
          tests/platforms/ios/test_preflight.py
          tests/reporting/test_report_writer.py
          tests/api/test_report_evidence.py
