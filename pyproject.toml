# Package metadata, direct dependencies and pytest settings; requirements.txt mirrors the dependencies.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-playbook-automation"
version = "0.1.0"
description = "Mobile Playbook Automation framework for IPA acquisition, static analysis, installation, keyboard testing, and behavior validation"
requires-python = ">=3.11"
dependencies = [
  "Appium-Python-Client>=4.0.0",
  "selenium>=4.0.0",
  "PyYAML>=6.0.0",
  "pytest>=8.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "ruamel.yaml>=0.18.0",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-CoreMedia>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
mobile-playbook = "mobile_playbook.cli:main"
mobile-playbook-api = "mobile_playbook.api.__main__:main"
mobile-playbook-dashboard-sync = "mobile_playbook.dashboard_sync.worker:main"
mobile-playbook-assessment-worker = "mobile_playbook.workers.assessment_worker:main"
mobile-playbook-icon-backfill = "mobile_playbook.workers.icon_backfill:main"

[tool.setuptools.packages.find]
include = ["mobile_playbook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
